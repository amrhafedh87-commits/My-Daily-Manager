<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="مصاريفي">
    <link rel="manifest" href="manifest.json">
    <title>مصاريفي | تسجيل الدخول والبدء (ر.ي)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        yer: {
                            green: '#059669',
                            red: '#e11d48',
                            amber: '#d97706',
                            slate: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden selection:bg-blue-600 selection:text-white">

    <!-- خلفية جمالية وإضاءات ناعمة متجاوبة -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 -right-32 w-80 sm:w-96 h-80 sm:h-96 bg-blue-200/50 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -left-32 w-80 sm:w-96 h-80 sm:h-96 bg-emerald-200/40 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] bg-indigo-100/40 rounded-full blur-3xl"></div>
    </div>

    <!-- حاوية الإشعارات العائمة -->
    <div id="toastContainer" class="fixed top-4 left-4 right-4 sm:right-auto sm:left-6 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- بطاقة الدخول المركزية -->
    <div class="relative z-10 w-full max-w-md my-4 sm:my-8">

        <!-- ترويسة النظام والشعار الجديد: مصاريفي -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-emerald-500 shadow-xl shadow-blue-600/20 mb-3 sm:mb-4 border border-white p-3.5">
                <i class="fa-solid fa-wallet text-2xl sm:text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">
                مصاريفي
            </h1>
            <p class="text-slate-500 mt-1.5 text-xs sm:text-sm flex items-center justify-center gap-2">
                <span>إدارة مالية شخصية سهلة وسريعة</span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] sm:text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                    الريال اليمني (ر.ي)
                </span>
            </p>
        </div>

        <!-- البطاقة الرئيسية بالنمط الفاتح المتجاوب -->
        <div class="glass-panel rounded-2xl sm:rounded-3xl p-5 sm:p-8 bg-white border border-slate-200 shadow-xl">

            <!-- تنبيه الجلسة النشطة الحالية إن وجدت -->
            <div id="activeSessionBanner" class="hidden mb-5 p-3 rounded-xl sm:rounded-2xl bg-blue-50 border border-blue-200 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 text-slate-700">
                    <i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i>
                    <span>أنت مسجل حالياً كـ <strong id="activeSessionName" class="text-slate-900 font-mono font-bold"></strong></span>
                </div>
                <a href="index.html" class="px-3 py-1.5 rounded-lg sm:rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition flex items-center gap-1.5 text-xs shadow-md shadow-blue-600/20">
                    <span>متابعة</span>
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                </a>
            </div>

            <!-- قسم مبدل الحسابات السريع -->
            <div id="quickSwitcherSection" class="hidden mb-5 pb-5 border-b border-slate-200">
                <div class="flex items-center justify-between mb-2.5">
                    <span class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-users text-blue-600"></i>
                        الحسابات على هذا الجهاز
                    </span>
                    <span class="text-[11px] text-slate-500">اختر حسابك</span>
                </div>
                <div id="quickAccountsList" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-0.5 smooth-touch-scroll">
                    <!-- يتم تعبئة الحسابات ديناميكياً -->
                </div>
            </div>

            <!-- أزرار التبديل بين الدخول وإنشاء حساب -->
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl sm:rounded-2xl mb-5 border border-slate-200">
                <button id="tabLoginBtn" type="button" class="py-2.5 text-xs sm:text-sm font-bold rounded-lg sm:rounded-xl transition-all duration-200 bg-blue-600 text-white shadow-sm">
                    <i class="fa-solid fa-right-to-bracket ml-1.5"></i>
                    تسجيل الدخول
                </button>
                <button id="tabSignupBtn" type="button" class="py-2.5 text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 rounded-lg sm:rounded-xl transition-all duration-200">
                    <i class="fa-solid fa-user-plus ml-1.5"></i>
                    إنشاء حساب جديد
                </button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="space-y-3.5">
                <div>
                    <label for="loginUsername" class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="loginUsername" required autocomplete="username" placeholder="مثال: ahmed"
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl pr-10 pl-4 py-2.5 sm:py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="loginPassword" class="text-xs font-bold text-slate-700">كلمة المرور أو رمز PIN</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••"
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl pr-10 pl-11 py-2.5 sm:py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                        <button type="button" class="toggle-password-btn absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 hover:text-slate-600 p-2">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-[0.98] text-white font-bold rounded-xl shadow-md shadow-blue-600/25 transition-all flex items-center justify-center gap-2">
                        <span>دخول إلى مصاريفي</span>
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                    </button>
                </div>
            </form>

            <!-- نموذج إنشاء حساب جديد -->
            <form id="signupForm" class="space-y-3.5 hidden">
                <div>
                    <label for="signupFullName" class="block text-xs font-bold text-slate-700 mb-1.5">الاسم الكامل</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-id-card text-sm"></i>
                        </span>
                        <input type="text" id="signupFullName" required placeholder="مثال: أحمد علي المحمدي"
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl pr-10 pl-4 py-2.5 sm:py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <div>
                    <label for="signupUsername" class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم (بالإنجليزي بدون مسافات)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-at text-sm"></i>
                        </span>
                        <input type="text" id="signupUsername" required dir="ltr" placeholder="ahmed_ali"
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl pr-10 pl-4 py-2.5 sm:py-3 text-sm text-left text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <div>
                    <label for="signupPassword" class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور أو رمز PIN</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-key text-sm"></i>
                        </span>
                        <input type="password" id="signupPassword" required placeholder="على الأقل 4 خانات"
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl pr-10 pl-11 py-2.5 sm:py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                        <button type="button" class="toggle-password-btn absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 hover:text-slate-600 p-2">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="signupPasswordConfirm" class="block text-xs font-bold text-slate-700 mb-1.5">تأكيد كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-check-double text-sm"></i>
                        </span>
                        <input type="password" id="signupPasswordConfirm" required placeholder="أعد إدخال كلمة المرور"
                               class="w-full bg-slate-50 border border-slate-300 rounded-xl pr-10 pl-11 py-2.5 sm:py-3 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                        <button type="button" class="toggle-password-btn absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 hover:text-slate-600 p-2">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- خيار تعبئة بيانات تجريبية -->
                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" id="fillSampleData" class="w-4 h-4 mt-0.5 rounded text-blue-600 focus:ring-blue-500 bg-white border-slate-300 cursor-pointer">
                    <label for="fillSampleData" class="text-xs text-slate-700 cursor-pointer select-none leading-relaxed">
                        تعبئة حركات مالية تجريبية واقعية بالريال اليمني (لتجربة مصاريفي فوراً)
                    </label>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-[0.98] text-white font-bold rounded-xl shadow-md shadow-emerald-600/25 transition-all flex items-center justify-center gap-2">
                        <span>إنشاء الحساب والبدء</span>
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>
                </div>
            </form>

            <!-- زر حساب تجريبي سريع بنقرة واحدة -->
            <div class="mt-5 pt-4 border-t border-slate-200 text-center">
                <button id="quickDemoBtn" type="button" class="text-xs text-blue-600 hover:text-blue-800 inline-flex items-center gap-1.5 transition-colors font-bold p-1">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>تجربة سريعة بدون كتابة (حساب تجريبي فوري)</span>
                </button>
            </div>

        </div>

        <!-- معلومات الخصوصية والأمان -->
        <div class="mt-4 sm:mt-6 text-center text-[11px] sm:text-xs text-slate-500 space-y-1">
            <p class="flex items-center justify-center gap-1.5 font-medium">
                <i class="fa-solid fa-shield-halved text-emerald-600"></i>
                <span>خصوصية تامة 100%: تُحفظ جميع بياناتك محلياً على جهازك فقط</span>
            </p>
            <p class="font-medium">تطبيق مصاريفي &copy; معتمد بالريال اليمني (ر.ي / YER)</p>
        </div>

    </div>

    <!-- كود الجافاسكربت الخاص بصفحة تسجيل الدخول -->
    <script src="login.js"></script>




    <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(registration => {
        console.log("Masareefi PWA Ready");
      })
      .catch(error => {
        console.error("PWA Error:", error);
      });
  });
}
</script>
</body>
</html>
